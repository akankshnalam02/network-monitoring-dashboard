{% extends "base.html" %}{% block title %}Sign in | Network Monitor{% endblock
%}{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="brand-mark large">NM</span>
    <p class="eyebrow">Administrator access</p>
    <h1>Welcome back.</h1>
    <p class="lede">Sign in to inspect your network health.</p>
    <form method="post" class="form-stack">
      <label
        >Username<input
          name="username"
          autocomplete="username"
          required /></label
      ><label
        >Password<input
          name="password"
          type="password"
          autocomplete="current-password"
          required /></label
      ><button class="btn btn-primary btn-lg" type="submit">
        Open dashboard
      </button>
    </form>
    <small class="muted">Demo credentials: admin / admin</small>
  </div>
</div>
{% endblock %}
